<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanzania Flag</title>
    <style>
         :root {
            --bg-1: #061f18;
            --bg-2: #0d3b2f;
            --card: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.18);
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: radial-gradient(circle at top, var(--bg-2), var(--bg-1) 60%);
            color: #fff;
        }
        
        .flag-card {
            width: min(88vw, 860px);
            padding: 28px;
            border-radius: 24px;
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
        }
        
        .title {
            margin: 0 0 18px;
            text-align: center;
            letter-spacing: 0.18em;
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #d9f7df;
        }
        
        .flag-frame {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 18px;
        }
        
        img {
            display: block;
            width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div class="flag-card">
        <h1 class="title">Tanzania Flag</h1>
        <div class="flag-frame">
            <img src="image/tanzania-flag.jpg" alt="Tanzania flag">
        </div>
    </div>
</body>

</html>
