<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Tafsiri ya papo kwa papo kati ya Sukuma, Kihaya/Ruhaya, Kinyakyusa na Kiswahili kwa sauti au maandishi.">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tanlingo">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/logo.png">
    <link rel="icon" type="image/svg+xml" href="/tanlingo-app-icon.svg">
    <title>Tanlingo — Mtafsiri wa lugha za Tanzania</title>
    <link rel="stylesheet" href="styles.css?v=tanlingo-v6">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js').catch(() => {});
            });
        }
    </script>
</head>
<body>
    <section class="splash-screen" id="chatbot-splash" aria-label="Tanlingo inafunguka">
        <div class="splash-content">
            <img class="splash-logo" src="/tanlingo-app-icon.svg" alt="Tanlingo">
            <p class="splash-guide">Mawasiliano ya lugha za Tanzania, kwa urahisi.</p>
        </div>
    </section>
